# QindaQt platform power defaults (container-wm ADR-0378).
#
# While QindaQt's native power policy is not exclusive, logind performs these
# actions. Owner decision, 2026-10-16: a short power-button press suspends and
# a long press powers off. Closing the lid on battery suspends, then hibernates
# when the battery runs low or after HibernateDelaySec (sleep.conf.d). On AC
# power the laptop stays suspended. With an external display attached, a closed
# lid is ignored.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
