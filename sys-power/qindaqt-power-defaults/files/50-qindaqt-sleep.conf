# QindaQt platform sleep defaults (container-wm ADR-0378).
#
# suspend-then-hibernate hibernates when the battery falls below 5% or after
# this delay, whichever comes first. On hardware whose s2idle wakes spuriously,
# the low-battery check is what keeps a lid-closed laptop from draining flat.
# On AC power the system stays suspended.
[Sleep]
HibernateDelaySec=90min
HibernateOnACPower=no
