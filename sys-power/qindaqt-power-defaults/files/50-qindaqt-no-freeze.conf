# QindaQt platform sleep defaults (container-wm ADR-0378).
#
# Since systemd 256, user sessions are frozen before sleep. A process that is
# blocked in a FUSE request, such as an sshfs network location whose network
# has just gone down, cannot be frozen. Suspend then never starts, and the
# frozen desktop forces a hard power-off (2026-10-12 and 2026-10-14). Keep the
# pre-256 behaviour.
[Service]
Environment=SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=false
